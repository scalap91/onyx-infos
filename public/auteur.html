<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auteur — Onyx Infos</title>
<meta name="description" content="">
<meta property="og:type" content="profile">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<link rel="canonical" href="">
<link rel="icon" type="image/svg+xml" href="/onyx-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#080808;--noir2:#111111;--noir3:#1a1a1a;
  --rouge:#cc0000;--w:#f5f5f0;--w2:rgba(245,245,240,.7);--w3:rgba(245,245,240,.4);
  --mid:#555550;
  --D:'Playfair Display',serif;--B:'Barlow',sans-serif;--C:'Barlow Condensed',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--B);background:var(--noir);color:var(--w);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--noir2)}::-webkit-scrollbar-thumb{background:#8b0000}

nav{background:var(--noir2);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:100}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;max-width:1200px;margin:0 auto}
.nav-logo{display:flex;flex-direction:column;line-height:1}
.nav-logo span:first-child{font-family:var(--C);font-size:1.6rem;font-weight:900;letter-spacing:.02em;color:var(--w)}
.nav-logo span:last-child{font-family:var(--C);font-size:.55rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--rouge)}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-links a{font-family:var(--C);font-size:.85rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--w2)}
.nav-links a:hover{color:var(--rouge)}
.nav-links a.on{color:var(--rouge)}

/* HERO AUTEUR */
.hero{padding:60px 40px 50px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:50px;align-items:start}
.hero-photo{width:280px;aspect-ratio:3/4;background:var(--noir2) center/cover no-repeat;border-bottom:3px solid var(--rouge)}
.hero-body{padding-top:8px}
.kicker{font-family:var(--C);font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rouge);margin-bottom:10px}
h1.author-name{font-family:var(--D);font-weight:900;font-size:clamp(2rem,4vw,3.4rem);line-height:1.05;letter-spacing:-.02em;color:var(--w);margin-bottom:18px}
.author-bio{font-family:var(--B);font-size:1.1rem;line-height:1.65;color:var(--w2);max-width:640px;margin-bottom:18px}
.author-meta{font-family:var(--C);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--w3)}

@media(max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px}
  .hero-photo{width:200px}
}

/* SECTION ARTICLES */
.sect{padding:30px 40px 80px;max-width:1100px;margin:0 auto}
.sect-h{font-family:var(--D);font-weight:700;font-size:1.5rem;color:var(--w);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.art{display:flex;flex-direction:column;gap:0;background:var(--noir2);border:1px solid rgba(255,255,255,.05);transition:transform .2s,border-color .2s}
.art:hover{transform:translateY(-2px);border-color:var(--rouge)}
.art-img{width:100%;aspect-ratio:16/10;background:var(--noir3) center/cover no-repeat}
.art-body{padding:14px 18px 18px}
.art-cat{font-family:var(--C);font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rouge);margin-bottom:6px}
.art-title{font-family:var(--D);font-weight:700;font-size:1.05rem;line-height:1.25;color:var(--w);margin-bottom:8px}
.art-date{font-family:var(--C);font-size:.62rem;font-weight:500;color:var(--w3);text-transform:uppercase;letter-spacing:.06em}

.empty{padding:60px 0;text-align:center;color:var(--w3);font-size:.95rem}
footer{border-top:1px solid rgba(255,255,255,.06);padding:30px 40px;text-align:center;color:var(--w3);font-family:var(--C);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><span>ONYX</span><span>Infos</span></a>
  <div class="nav-links">
    <a href="/">Accueil</a>
    <a href="/equipe" class="on">L'équipe</a>
    <a href="/onyx-archives.html">Archives</a>
  </div>
</nav>

<div id="root">
  <div class="empty">Chargement…</div>
</div>

<footer>© Onyx Infos — La rédaction</footer>

<script id="ld-author" type="application/ld+json"></script>

<script>
const SITE = 'https://onyx-infos.fr';

// Le slug peut venir de /auteur/<slug> (path) ou ?slug=<slug>
function getSlug() {
  const m = location.pathname.match(/^\/auteur\/([^\/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(location.search).get('slug') || '';
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}

async function loadAuthor() {
  const slug = getSlug();
  if (!slug) {
    document.getElementById('root').innerHTML = '<div class="empty">Auteur introuvable.</div>';
    return;
  }
  try {
    const r = await fetch(`https://bizzi.fr/api/agents/public/${encodeURIComponent(slug)}?tenant=onyx`);
    if (!r.ok) throw new Error(r.status === 404 ? 'Auteur introuvable' : 'Erreur ' + r.status);
    const a = await r.json();

    // SEO meta
    document.title = `${a.name} — Onyx Infos`;
    const photoFull = a.photo_url ? `${SITE}${a.photo_url}` : '';
    document.querySelector('meta[name="description"]').setAttribute('content', a.bio_public || `${a.name}, journaliste pour Onyx Infos.`);
    document.querySelector('meta[property="og:title"]').setAttribute('content', `${a.name} — Onyx Infos`);
    document.querySelector('meta[property="og:description"]').setAttribute('content', a.bio_public || '');
    document.querySelector('meta[property="og:image"]').setAttribute('content', photoFull);
    document.querySelector('meta[property="og:url"]').setAttribute('content', `${SITE}/auteur/${slug}`);
    document.querySelector('link[rel="canonical"]').setAttribute('href', `${SITE}/auteur/${slug}`);

    // JSON-LD Person (schema.org pour Google News)
    document.getElementById('ld-author').textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": `${SITE}/auteur/${slug}#person`,
      "name": a.name,
      "url": `${SITE}/auteur/${slug}`,
      "image": photoFull,
      "jobTitle": a.specialty ? `Journaliste ${a.specialty}` : 'Journaliste',
      "description": a.bio_public,
      "worksFor": {
        "@type": "NewsMediaOrganization",
        "name": "Onyx Infos",
        "url": SITE
      }
    });

    // Render
    const articlesHtml = (a.articles || []).map(art => `
      <a class="art" href="/article/${art.slug}">
        ${art.image_url ? `<div class="art-img" style="background-image:url('${art.image_url.startsWith('http')?art.image_url:SITE+art.image_url}')"></div>` : ''}
        <div class="art-body">
          <div class="art-cat">${escapeHtml(art.category)}</div>
          <div class="art-title">${escapeHtml(art.title)}</div>
          <div class="art-date">${fmtDate(art.published_at)}</div>
        </div>
      </a>
    `).join('');

    document.getElementById('root').innerHTML = `
      <header class="hero">
        <div class="hero-photo" style="background-image:url('${escapeHtml(a.photo_url)}')"></div>
        <div class="hero-body">
          <div class="kicker">${escapeHtml(a.specialty || 'Journaliste')}</div>
          <h1 class="author-name">${escapeHtml(a.name)}</h1>
          <p class="author-bio">${escapeHtml(a.bio_public)}</p>
          <div class="author-meta">${(a.articles || []).length} article${(a.articles || []).length > 1 ? 's' : ''} publié${(a.articles || []).length > 1 ? 's' : ''}</div>
        </div>
      </header>
      <section class="sect">
        <div class="sect-h">Derniers articles</div>
        ${articlesHtml ? `<div class="articles">${articlesHtml}</div>` : '<div class="empty">Aucun article publié pour le moment.</div>'}
      </section>
    `;
  } catch (e) {
    document.getElementById('root').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

loadAuthor();
</script>
</body>
</html>
