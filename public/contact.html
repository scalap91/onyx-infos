<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Onyx Infos</title>
<link rel="icon" type="image/svg+xml" href="onyx-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--noir:#080808;--noir2:#111111;--rouge:#cc0000;--w:#f5f5f0;--w2:rgba(245,245,240,.7);--D:'Playfair Display',serif;--B:'Barlow',sans-serif;--C:'Barlow Condensed',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--B);background:var(--noir);color:var(--w);-webkit-font-smoothing:antialiased}
nav{background:var(--noir2);border-bottom:3px solid var(--rouge);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--C);font-size:1.6rem;font-weight:900;color:var(--w);text-decoration:none}
.logo span{display:block;font-size:.55rem;letter-spacing:.25em;color:var(--rouge)}
.back{font-family:var(--C);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,245,240,.5);text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:8px 16px}
.container{max-width:700px;margin:60px auto;padding:0 40px 80px}
h1{font-family:var(--D);font-size:2.2rem;font-weight:900;margin-bottom:8px}
.subtitle{font-family:var(--C);font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--rouge);margin-bottom:40px}
.contact-box{background:var(--noir2);padding:40px;border-top:2px solid var(--rouge);margin-bottom:24px}
.contact-label{font-family:var(--C);font-size:.55rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rouge);margin-bottom:8px}
.contact-value{font-size:.95rem;color:var(--w);margin-bottom:24px}
.contact-value a{color:var(--w);text-decoration:none;border-bottom:1px solid var(--rouge)}
p{font-size:.88rem;line-height:1.9;color:var(--w2);margin-bottom:16px}
@media(max-width:768px){nav{padding:0 16px}.container{padding:0 16px 60px}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">ONYX<span>INFOS</span></a>
  <a class="back" href="index.html">← Accueil</a>
</nav>
<div class="container">
  <h1>Contact</h1>
  <div class="subtitle">Nous contacter</div>
  <div class="contact-box">
    <div class="contact-label">Email général</div>
    <div class="contact-value"><a href="mailto:contact@onyx-infos.fr">contact@onyx-infos.fr</a></div>
    <div class="contact-label">Rédaction</div>
    <div class="contact-value"><a href="mailto:redaction@onyx-infos.fr">redaction@onyx-infos.fr</a></div>
    <div class="contact-label">Site web</div>
    <div class="contact-value"><a href="https://onyx-infos.fr">onyx-infos.fr</a></div>
  </div>
  <p>Pour toute question, suggestion ou signalement d'erreur, n'hésitez pas à nous écrire. Nous répondons dans les meilleurs délais.</p>
</div>
</body>
</html>
