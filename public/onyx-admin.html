<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onyx Infos — Admin</title>
<link rel="icon" type="image/svg+xml" href="onyx-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080808;display:flex;flex-direction:column;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}

/* ── BARRE MINIMALISTE ── */
.bar{
  background:#080808;border-bottom:3px solid #cc0000;
  padding:8px 16px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;flex-wrap:wrap;
}
.bar-logo{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0}
.bar-logo img{width:22px;height:22px;object-fit:contain}
.bar-logo-text{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:800;letter-spacing:.04em;color:#f5f5f0}
.bar-logo-text span{color:#cc0000}

/* Métriques inline */
.metrics{display:flex;gap:1px;flex-shrink:0}
.metric{
  background:#111;padding:4px 12px;border-left:2px solid #cc0000;
  display:flex;flex-direction:column;align-items:center;
}
.metric-val{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;color:#cc0000;line-height:1}
.metric-lbl{font-size:.48rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,245,240,.35);margin-top:1px}

/* Champ clé API */
.api-field{display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
.api-label{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,245,240,.35);white-space:nowrap}
.api-input{
  flex:1;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);
  color:#f5f5f0;font-size:.68rem;font-family:'Barlow',monospace;
  padding:5px 10px;outline:none;border-radius:2px;
  transition:border-color .15s;
}
.api-input:focus{border-color:#cc0000}
.api-input::placeholder{color:rgba(245,245,240,.2)}
.api-save{
  font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;background:#cc0000;color:#fff;
  border:none;cursor:pointer;border-radius:2px;white-space:nowrap;
  transition:background .15s;
}
.api-save:hover{background:#ff1a1a}

/* Actions rapides */
.actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.btn{
  font-family:'Barlow Condensed',sans-serif;font-size:.58rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:2px;cursor:pointer;border:none;
  transition:all .15s;white-space:nowrap;
}
.btn-rouge{background:#cc0000;color:#fff}
.btn-rouge:hover{background:#ff1a1a}
.btn-ghost{background:transparent;color:rgba(245,245,240,.4);border:1px solid rgba(255,255,255,.08)}
.btn-ghost:hover{color:#f5f5f0}

/* Statut pill */
.status{display:flex;align-items:center;gap:5px;font-size:.6rem;color:rgba(245,245,240,.4);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%}
.dot-on{background:#00aa55;animation:p 1.5s infinite}
.dot-off{background:#555}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(0,170,85,.5)}70%{box-shadow:0 0 0 4px rgba(0,170,85,0)}}

/* Toast */
.toast{
  position:fixed;bottom:16px;right:16px;z-index:999;
  font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:10px 18px;border-radius:2px;background:#cc0000;color:#fff;
  transform:translateY(60px);opacity:0;transition:all .25s ease;
}
.toast.show{transform:translateY(0);opacity:1}

/* ── IFRAME ── */
.frame-wrap{flex:1;display:flex;overflow:hidden}
iframe{flex:1;border:none;width:100%;height:100%;background:#020200}

@media(max-width:768px){
  .bar{gap:8px;padding:6px 10px}
  .metrics{display:none}
  .api-label{display:none}
  .actions .btn-ghost{display:none}
}
</style>
</head>
<body>

<!-- BARRE MINIMALISTE -->
<div class="bar">

  <!-- Logo -->
  <a class="bar-logo" href="index.html">
    <img src="onyx-logo.svg" alt="">
    <div class="bar-logo-text">Onyx <span>Infos</span></div>
  </a>

  <!-- Métriques -->
  <div class="metrics">
    <div class="metric">
      <div class="metric-val" id="m-articles">—</div>
      <div class="metric-lbl">Articles</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-agents">5</div>
      <div class="metric-lbl">Agents</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-plan">PRO</div>
      <div class="metric-lbl">Plan</div>
    </div>
  </div>

  <!-- Clé API -->
  <div class="api-field">
    <span class="api-label">Clé API Bizzi</span>
    <input
      type="password"
      class="api-input"
      id="api-key"
      placeholder="Token Bizzi..."
      autocomplete="off"
    >
    <button class="api-save" onclick="sauvegarderCle()">Enregistrer</button>
  </div>

  <!-- Statut + Actions -->
  <div class="actions">
    <div class="status"><div class="dot dot-off" id="api-dot"></div><span id="api-label-status">Non connecté</span></div>
    <button class="btn btn-rouge" onclick="lancerPipeline()">⚡ Pipeline</button>
    <button class="btn btn-ghost" onclick="location.href='index.html'">← Site</button>
  </div>

</div>

<!-- IFRAME BIZZI -->
<div class="frame-wrap">
  <iframe id="bizzi-frame" src="https://bizzi.fr/bizzi-dashboard.html" title="Bizzi — Onyx Infos" allow="clipboard-write"></iframe>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const BIZZI_API = 'https://bizzi.fr/api';
const TENANT    = 'onyx-infos';
const STORAGE_KEY = 'onyx_bizzi_token';

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.getElementById('api-key').value = saved;
    verifierConnexion(saved);
  }
});

// ── SAUVEGARDER CLÉ ──
function sauvegarderCle() {
  const token = document.getElementById('api-key').value.trim();
  if (!token) { showToast('Entrez un token Bizzi', '#555'); return; }
  localStorage.setItem(STORAGE_KEY, token);
  verifierConnexion(token);
}

// ── VÉRIFIER CONNEXION ──
async function verifierConnexion(token) {
  const dot   = document.getElementById('api-dot');
  const label = document.getElementById('api-label-status');
  dot.className = 'dot dot-off';
  label.textContent = 'Vérification...';

  try {
    const r = await fetch(BIZZI_API + '/content/list', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    if (r.ok) {
      const data = await r.json();
      dot.className = 'dot dot-on';
      label.textContent = 'Connecté';
      const count = Array.isArray(data) ? data.length : 0;
      document.getElementById('m-articles').textContent = count;
      showToast('✓ Clé API valide — ' + count + ' article(s)', '#00aa55');

      // Envoyer le token à l'iframe Bizzi
      const frame = document.getElementById('bizzi-frame');
      frame.contentWindow?.postMessage({type:'bizzi-token', token}, 'https://bizzi.fr');
    } else {
      throw new Error();
    }
  } catch(e) {
    dot.className = 'dot dot-off';
    label.textContent = 'Token invalide';
    showToast('✗ Token invalide', '#cc0000');
  }
}

// ── LANCER PIPELINE ──
async function lancerPipeline() {
  const token = localStorage.getItem(STORAGE_KEY) || document.getElementById('api-key').value.trim();
  if (!token) { showToast('Entrez d\'abord votre clé API', '#555'); return; }

  showToast('Lancement pipeline...', '#e6a800');
  try {
    const r = await fetch(BIZZI_API + '/pipeline/run', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({tenant: TENANT, domain: 'media'})
    });
    const data = await r.json();
    showToast('⚡ Pipeline lancé — ' + data.run_id, '#00aa55');
  } catch(e) {
    showToast('✗ Erreur API', '#cc0000');
  }
}

// ── TOAST ──
function showToast(msg, color = '#cc0000') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
